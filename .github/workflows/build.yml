name: Build

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  jvm-tests:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - run: ./gradlew :core:jvmTest :languages:kotlin:jvmTest :languages:swift:jvmTest :languages:ruby:jvmTest :languages:rust:jvmTest :languages:python:jvmTest :languages:go:jvmTest :languages:java:jvmTest

  android:
    name: Android demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - run: ./gradlew :composeApp:assembleDebug

  verify-notice:
    name: Verify NOTICE in language artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal -PRELEASE_SIGNING_ENABLED=false --no-configuration-cache
      - name: Verify META-INF/NOTICE in published artifacts
        run: bash scripts/verify-notice.sh

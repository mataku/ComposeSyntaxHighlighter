name: Build

on:
  pull_request:
  push:
    branches: [ develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || 'dev' }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-android-deps
      - uses: ./.github/actions/setup-tree-sitter
      - run: ./gradlew jvmTest -x :benchmarks:jvm:jvmTest

  api-check:
    name: Public API check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-android-deps
      - uses: ./.github/actions/setup-tree-sitter
      - run: ./gradlew apiCheck

  android:
    name: Android demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-android-deps
      - uses: ./.github/actions/setup-tree-sitter
      - run: ./gradlew :samples:androidApp:assembleDebug

  verify-notice:
    name: Verify NOTICE in language artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-android-deps
      - uses: ./.github/actions/setup-tree-sitter
      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal -PRELEASE_SIGNING_ENABLED=false --no-configuration-cache
      - name: Verify META-INF/NOTICE in published artifacts
        run: bash scripts/verify-notice.sh

  dokka:
    name: Dokka
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-android-deps
      - uses: ./.github/actions/setup-tree-sitter
      - run: ./gradlew dokkaGenerate

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-android-deps
      - uses: ./.github/actions/setup-tree-sitter
      - name: Cache Konan toolchain
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-kotlin-2.3.20
      - name: Compile iOS targets
        run: ./gradlew compileKotlinIosArm64 :samples:composeApp:linkDebugFrameworkIosArm64

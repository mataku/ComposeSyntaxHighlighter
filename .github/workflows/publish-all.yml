name: Publish all

on:
  workflow_dispatch:

jobs:
  linux-jvm-natives:
    uses: ./.github/workflows/linux-jvm-natives.yml

  publish:
    needs: linux-jvm-natives
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - parallel:
          - uses: ./.github/actions/setup-android-deps
          - uses: ./.github/actions/setup-tree-sitter

      - name: Refuse SNAPSHOT versions
        run: |
          FAIL=0
          for f in gradle.properties languages/*/gradle.properties; do
            VERSION=$(grep '^VERSION_NAME=' "$f" | cut -d= -f2)
            if [ -z "$VERSION" ]; then
              echo "VERSION_NAME not found in $f" >&2
              FAIL=1
            elif [[ "$VERSION" == *SNAPSHOT* ]]; then
              echo "Refusing to publish SNAPSHOT version $VERSION ($f)" >&2
              FAIL=1
            fi
          done
          exit "$FAIL"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: linux-jvm-natives-*
          path: build/linux-jvm-natives
          merge-multiple: true

      - name: Build & publish to Maven Local (pre-flight)
        run: ./gradlew publishToMavenLocal -PprebuiltJvmNativesDir=build/linux-jvm-natives -PRELEASE_SIGNING_ENABLED=false --no-configuration-cache

      - name: Verify META-INF/NOTICE in published artefacts
        run: bash scripts/verify-notice.sh

      - name: Verify bundled grammar libraries in JVM jars
        run: bash scripts/verify-jvm-natives.sh

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALUSERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_MAVENCENTRALPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}
        run: ./gradlew publishToMavenCentral -PprebuiltJvmNativesDir=build/linux-jvm-natives --no-configuration-cache

      - name: Tag release on success
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "Tagged $TAG"

  deploy-docs:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - parallel:
          - uses: ./.github/actions/setup-android-deps
          - uses: ./.github/actions/setup-tree-sitter
      - run: ./gradlew dokkaGenerate
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dokka/html
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

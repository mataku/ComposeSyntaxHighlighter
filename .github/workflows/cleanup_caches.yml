# ref: https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#force-deleting-cache-entries

name: cleanup all caches
on:
  workflow_dispatch:
  schedule:
    - cron: '00 09 1 * *'

# The job authenticates with a GitHub App token, so GITHUB_TOKEN needs no scopes.
permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      id: app-token
      with:
        app-id: ${{ vars.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}

    - name: Delete all caches
      run: gh cache delete --all --succeed-on-no-caches -R "$REPO"
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        REPO: ${{ github.repository }}

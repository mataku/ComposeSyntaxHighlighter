name: Cache Konan toolchain
description: Cache ~/.konan keyed by the Kotlin version declared in the version catalog.

runs:
  using: composite
  steps:
    - name: Resolve Kotlin version from version catalog
      id: kotlin
      shell: bash
      run: echo "version=$(sed -nE 's/^kotlin = "(.+)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

    - name: Cache Konan toolchain
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-kotlin-${{ steps.kotlin.outputs.version }}

name: Setup toolchain
description: Install JDK, Android SDK + NDK + CMake, Node, pnpm (via corepack), tree-sitter CLI, and Gradle.

runs:
  using: composite
  steps:
    - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        distribution: temurin
        java-version: 17

    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      with:
        packages: |
          cmdline-tools;latest
          platforms;android-36
          build-tools;36.0.0
          cmake;3.22.1
          ndk;26.3.11579264

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 20

    # The convention plugin invokes `tree-sitter generate` to materialize parser.c
    # for grammars (notably tree-sitter-swift) that do not commit a generated parser.
    # Security posture:
    #   - pnpm version is pinned via the `packageManager` field in package.json
    #     and fetched by corepack, so the toolchain version is reproducible and
    #     auditable from the manifest.
    #   - `pnpm.onlyBuiltDependencies` in package.json is a strict allow-list:
    #     only `tree-sitter-cli` may run lifecycle scripts. Any new transitive
    #     dependency that ships an install/postinstall script will be blocked
    #     until explicitly added to this list.
    #   - `pnpm.minimumReleaseAge` (10080 minutes / 7 days) holds back versions
    #     published less than a week ago, mitigating "fresh malicious publish"
    #     supply-chain attacks.
    - name: Enable corepack (resolves pnpm pinned in packageManager field)
      shell: bash
      run: corepack enable
    - name: Install npm deps via pnpm
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Expose tree-sitter on PATH
      shell: bash
      run: echo "${GITHUB_WORKSPACE}/node_modules/.bin" >> "$GITHUB_PATH"

    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

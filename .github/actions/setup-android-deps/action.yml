name: Setup toolchain
description: Install JDK, Android SDK + NDK + CMake, and Gradle. Use setup-tree-sitter alongside this action when a job needs the tree-sitter CLI (e.g. jobs whose output depends on parser.c freshness).

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: 17

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: >-
          platforms;android-37.0
          build-tools;36.0.0
          cmake;3.22.1
          ndk;26.3.11579264

    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
